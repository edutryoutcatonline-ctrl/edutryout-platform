            try {

                const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
                const manifest = {
                    name: 'EduTryout Platform CAT',
                    short_name: 'EduTryout',
                    description: 'Aplikasi Tryout & Simulasi Ujian CAT Online',
                    start_url: '.',
                    display: 'standalone',
                    background_color: '#f8fafc',
                    theme_color: '#4f46e5',
                    icons: [
                        { src: iconUrl, sizes: '192x192', type: 'image/svg+xml' },
                        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }
                    ]
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                const linkEl = document.getElementById('pwa-manifest-link');
                if (linkEl) linkEl.href = URL.createObjectURL(blob);
            } catch (e) {
                console.warn('Manifest setup skipped:', e);
            }
        })();

        function normalizePackage(pkg) {
            if (Array.isArray(pkg.subPackages) && pkg.subPackages.length > 0) {
                return {
                    ...pkg,
                    reviewDelayMinutes: Number(pkg.reviewDelayMinutes) || 0,
                    hideAfterMinutes: Number(pkg.hideAfterMinutes) || 0
                };
            }
            const legacyQuestions = Array.isArray(pkg.questions) ? pkg.questions : [];
            return {
                ...pkg,
                reviewDelayMinutes: Number(pkg.reviewDelayMinutes) || 0,
                hideAfterMinutes: Number(pkg.hideAfterMinutes) || 0,
                subPackages: [
                    {
                        id: 'SUB-' + pkg.id,
                        title: 'Sub-Paket 1: Soal Utama',
                        questions: legacyQuestions
                    }
                ]
            };
        }

        function getPackageAllQuestions(pkg) {
            const norm = normalizePackage(pkg);
            const list = [];
            norm.subPackages.forEach(sp => {
                (sp.questions || []).forEach(q => {
                    list.push({
                        ...q,
                        subPackageTitle: sp.title
                    });
                });
            });
            return list;
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return JSON.parse(JSON.stringify(defaultState));
                const parsed = JSON.parse(raw);
                const merged = {
                    ...JSON.parse(JSON.stringify(defaultState)),
                    ...parsed,
                    adminContact: {
                        ...defaultState.adminContact,
                        ...(parsed.adminContact || {})
                    },
                    faqs: Array.isArray(parsed.faqs) && parsed.faqs.length > 0
                        ? parsed.faqs
                        : JSON.parse(JSON.stringify(defaultState.faqs)),
                    emailConfig: parsed.emailConfig || { serviceId: '', templateId: '', publicKey: '' },
                    paymentMethods: Array.isArray(parsed.paymentMethods) && parsed.paymentMethods.length > 0
                        ? parsed.paymentMethods
                        : JSON.parse(JSON.stringify(defaultState.paymentMethods)),
                    attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
                    transactions: Array.isArray(parsed.transactions) ? parsed.transactions : []
                };
                merged.packages = (merged.packages || []).map(normalizePackage);
                merged.users = (merged.users || []).map(u => ({
                    ...u,
                    username: u.username || u.email.split('@')[0]
                }));
                return merged;
            } catch (e) {
                return JSON.parse(JSON.stringify(defaultState));
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Gagal menyimpan state:', e);
            }
        }

        function getNowFormatted() {
            const now = new Date();
            return now.toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatRupiah(num) {
            if (!num || num === 0) return 'GRATIS';
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const root = document.getElementById('toast-root');
            if (!root) return;

            const colors = {
                success: 'bg-emerald-600 text-white border-emerald-700',
                error: 'bg-rose-600 text-white border-rose-700',
                info: 'bg-slate-800 text-white border-slate-900',
                warning: 'bg-amber-500 text-white border-amber-600'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-exclamation',
                info: 'fa-circle-info',
                warning: 'fa-triangle-exclamation'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info} text-base"></i>
                <span class="flex-1 leading-relaxed">${escapeHtml(message)}</span>
            `;
            root.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3800);
        }

        function closeModal() {
            const root = document.getElementById('modal-root');
            if (root) root.innerHTML = '';
        }

        function openModal(htmlContent) {
            const root = document.getElementById('modal-root');
            if (!root) return;
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 fade-in" onclick="if(event.target === this) closeModal()">
                    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg max-h-[90vh] overflow-y-auto">
                        ${htmlContent}
                    </div>
                </div>
            `;
        }

        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btnElement.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value;

            const user = state.users.find(u =>
                (
                    u.email.toLowerCase() === identifier.toLowerCase() ||
                    (u.username && u.username.toLowerCase() === identifier.toLowerCase()) ||
                    u.name.toLowerCase() === identifier.toLowerCase()
                ) &&
                u.password === password
            );

            if (!user) {
                showToast('Username/Email atau password salah!', 'error');
                return;
            }
            if (!user.tokenVerified) {
                showToast('Akun belum diverifikasi email.', 'warning');
                return;
            }
            if (!user.isApproved) {
                showToast('Akun Anda sedang dinonaktifkan / menunggu persetujuan Admin.', 'warning');
                return;
            }

            state.currentUser = user;
            state.activeTab = 'catalog';
            state.adminTab = 'overview';
            saveState();
            showToast(`Selamat datang kembali, ${user.name}!`, 'success');
            render();
        }

        function sendOtpEmailViaEmailJS(toName, toEmail, otpCode, purposeText) {
            const cfg = state.emailConfig || {};
            if (cfg.serviceId && cfg.templateId && cfg.publicKey) {
                fetch('https://api.emailjs.com/api/v1.0/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        service_id: cfg.serviceId,
                        template_id: cfg.templateId,
                        user_id: cfg.publicKey,
                        template_params: {
                            to_name: toName,
                            to_email: toEmail,
                            otp_code: otpCode,
                            message: `${purposeText}: ${otpCode}`
                        }
                    })
                }).then(res => {
                    if (res.ok) {
                        showToast('Email OTP berhasil terkirim ke ' + toEmail, 'success');
                    } else {
                        showToast('Gagal kirim via EmailJS, silakan gunakan kode OTP di layar.', 'info');
                    }
                }).catch(() => {
                    showToast('Koneksi EmailJS gagal, silakan gunakan kode OTP di layar.', 'info');
                });
            }
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;
            const confirmPass = document.getElementById('reg-pass-confirm').value;

            if (password !== confirmPass) {
                showToast('Konfirmasi password tidak cocok!', 'error');
                return;
            }
            if (state.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                showToast('Email sudah terdaftar di sistem!', 'error');
                return;
            }
            if (state.users.some(u => u.username && u.username.toLowerCase() === username.toLowerCase())) {
                showToast('Username sudah digunakan! Pilih username lain.', 'error');
                return;
            }

            const otpCode = String(Math.floor(100000 + Math.random() * 900000));
            state.tempRegisteredUser = {
                id: 'USR-' + Math.floor(1000 + Math.random() * 9000),
                username,
                name,
                email,
                password,
                role: 'user',
                otpCode,
                tokenVerified: false,
                isApproved: true
            };
            state.authView = 'verify';

            sendOtpEmailViaEmailJS(name, email, otpCode, 'Kode verifikasi pendaftaran EduTryout Anda adalah');
            showToast('Kode OTP 6 digit siap! Cek kotak masuk simulasi di layar.', 'success');
            render();
        }

        function verifyEmailAction(e) {
            e.preventDefault();
            if (!state.tempRegisteredUser) return;
            const inputOtp = document.getElementById('verify-otp-input').value.trim();

            if (inputOtp !== state.tempRegisteredUser.otpCode) {
                showToast('Kode OTP salah! Periksa kembali kode 6 digit Anda.', 'error');
                return;
            }

            const verifiedUser = {
                ...state.tempRegisteredUser,
                tokenVerified: true,
                isApproved: true
            };
            delete verifiedUser.otpCode;

            state.users.push(verifiedUser);
            state.tempRegisteredUser = null;
            state.authView = 'login';
            saveState();
            showToast('Verifikasi berhasil! Silakan login dengan akun baru Anda.', 'success');
            render();
        }

        function handleForgotRequest(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();
            const user = state.users.find(u => u.email.toLowerCase() === email.toLowerCase());

            if (!user) {
                showToast('Email tidak ditemukan di database kami!', 'error');
                return;
            }

            const otpCode = String(Math.floor(100000 + Math.random() * 900000));
            state.forgotResetData = {
                userId: user.id,
                email: user.email,
                name: user.name,
                otpCode
            };

            sendOtpEmailViaEmailJS(user.name, user.email, otpCode, 'Kode OTP Reset Password EduTryout Anda adalah');
            showToast('Kode OTP reset password telah dibuat!', 'success');
            render();
        }

        function handleForgotResetSubmit(e) {
            e.preventDefault();
            if (!state.forgotResetData) return;

            const otpInput = document.getElementById('forgot-otp').value.trim();
            const newPass = document.getElementById('forgot-new-pass').value;
            const confirmPass = document.getElementById('forgot-confirm-pass').value;

            if (otpInput !== state.forgotResetData.otpCode) {
                showToast('Kode OTP reset password tidak sesuai!', 'error');
                return;
            }
            if (newPass.length < 4) {
                showToast('Password baru minimal 4 karakter.', 'error');
                return;
            }
            if (newPass !== confirmPass) {
                showToast('Konfirmasi password baru tidak cocok!', 'error');
                return;
            }

            const userIdx = state.users.findIndex(u => u.id === state.forgotResetData.userId);
            if (userIdx !== -1) {
                state.users[userIdx].password = newPass;
            }

            state.forgotResetData = null;
            state.authView = 'login';
            saveState();
            showToast('Password berhasil diperbarui! Silakan login.', 'success');
            render();
        }

        function logout() {
            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }
            state.currentUser = null;
            state.examSession = null;
            state.authView = 'landing';
            saveState();
            showToast('Anda telah keluar dari akun.', 'info');
            render();
        }

            const totalSlides = 3;
            state.landingSlide = ((state.landingSlide || 0) + delta + totalSlides) % totalSlides;

        function hasUserPurchasedPackage(userId, packageId) {
            return state.transactions.some(t => t.userId === userId && t.packageId === packageId && t.status === 'approved');
        }

        function hasPendingTransaction(userId, packageId) {
            return state.transactions.some(t => t.userId === userId && t.packageId === packageId && t.status === 'pending');
        }

        function getUserAttemptForPackage(userId, packageId) {
            return state.attempts.find(a => a.userId === userId && a.packageId === packageId);
        }

        function isCompletedPackageExpired(pkg, attempt) {
            if (!attempt) return false;
            const hideMinutes = Number(pkg.hideAfterMinutes) || 0;
            if (hideMinutes <= 0 || !attempt.completedAtTimestamp) return false;
            const expireTime = attempt.completedAtTimestamp + hideMinutes * 60 * 1000;
            return Date.now() >= expireTime;
        }

        function getPackageHideRemainingText(pkg, attempt) {
            if (!attempt) return '';
            const hideMinutes = Number(pkg.hideAfterMinutes) || 0;
            if (hideMinutes <= 0 || !attempt.completedAtTimestamp) return '';
            const expireTime = attempt.completedAtTimestamp + hideMinutes * 60 * 1000;
            const diffSec = Math.ceil((expireTime - Date.now()) / 1000);
            if (diffSec <= 0) return 'Paket telah disembunyikan';
            const hrs = Math.floor(diffSec / 3600);
            const mins = Math.floor((diffSec % 3600) / 60);
            const secs = diffSec % 60;
            const parts = [];
            if (hrs > 0) parts.push(`${hrs} jam`);
            if (mins > 0) parts.push(`${mins} menit`);
            if (hrs === 0 && mins === 0) parts.push(`${secs} detik`);
            return `Paket akan hilang otomatis dalam ${parts.join(' ')}`;
        }

        function getReviewAccessStatus(attempt) {
            const pkg = state.packages.find(p => p.id === attempt.packageId);
            const delayMinutes = pkg ? (Number(pkg.reviewDelayMinutes) || 0) : 0;
            if (!delayMinutes || !attempt.completedAtTimestamp) {
                return { unlocked: true, remainingText: '' };
            }
            const unlockTime = attempt.completedAtTimestamp + delayMinutes * 60 * 1000;
            const now = Date.now();
            if (now >= unlockTime) {
                return { unlocked: true, remainingText: '' };
            }
            const diffSec = Math.ceil((unlockTime - now) / 1000);
            const hrs = Math.floor(diffSec / 3600);
            const mins = Math.floor((diffSec % 3600) / 60);
            const secs = diffSec % 60;
            const unlockDateStr = new Date(unlockTime).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const parts = [];
            if (hrs > 0) parts.push(`${hrs} jam`);
            if (mins > 0) parts.push(`${mins} menit`);
            if (hrs === 0 && mins === 0) parts.push(`${secs} detik`);
            return {
                unlocked: false,
                remainingText: `Dapat diakses pukul ${unlockDateStr} (tunggu ${parts.join(' ')})`
            };
        }

                                ${firstMethod ? renderPaymentMethodTargetHtml(firstMethod) : '<p>Belum ada metode pembayaran diatur Admin.</p>'}

                                    class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-100 file:text-indigo-700 border border-slate-300 rounded-xl p-1.5">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Catatan / Nama Pengirim</label>
                                <input type="text" id="pay-proof-note" required placeholder="Contoh: Transfer a.n. Budi"
                                    class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs">

                            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-md">
                                Kirim Bukti Transfer (${formatRupiah(pkg.price)})
                            </button>
                        </form>
                    `}
                </div>
            `);
        }

        function renderPaymentMethodTargetHtml(m) {
            return `
                <div class="flex items-center justify-between">

        function updateSelectedPaymentInfo() {
            const sel = document.getElementById('pay-method-select');
            const box = document.getElementById('payment-target-box');
            if (!sel || !box) return;
            const m = (state.paymentMethods || []).find(item => item.id === sel.value);
            if (m) box.innerHTML = renderPaymentMethodTargetHtml(m);
        }

        function submitPaidPurchase(e, packageId) {
            e.preventDefault();
            const pkg = state.packages.find(p => p.id === packageId);
            if (!pkg || !state.currentUser) return;

            const sel = document.getElementById('pay-method-select');
            const m = (state.paymentMethods || []).find(item => item.id === sel?.value);
            const methodLabel = m ? `${m.type} - ${m.provider}` : 'Transfer Manual';
            const note = document.getElementById('pay-proof-note')?.value.trim() || '';
            const fileInput = document.getElementById('pay-proof-file');
            const file = fileInput?.files?.[0];

            const finalizeTx = (proofDataUrl) => {
                state.transactions.unshift({
                    id: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
                    userId: state.currentUser.id,
                    packageId: pkg.id,
                    amount: pkg.price,
                    method: methodLabel,
                    proofImage: proofDataUrl,
                    proofNote: note,
                    status: 'pending',
                    date: getNowFormatted()
                });

                saveState();
                closeModal();
                showToast('Bukti transfer berhasil dikirim! Menunggu konfirmasi Admin.', 'success');
                state.activeTab = 'catalog';
                render();
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = ev => finalizeTx(ev.target.result);
                reader.readAsDataURL(file);
            } else {
                finalizeTx('');
            }
        }

        function confirmPurchase(packageId, method, autoApprove = true) {
            const pkg = state.packages.find(p => p.id === packageId);
            if (!pkg || !state.currentUser) return;

            state.transactions.unshift({
                id: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
                userId: state.currentUser.id,
                packageId: pkg.id,
                amount: pkg.price,
                method,
                proofImage: '',
                proofNote: 'Aktivasi paket gratis',
                status: autoApprove ? 'approved' : 'pending',
                date: getNowFormatted()
            });

            saveState();
            closeModal();
            showToast('Paket berhasil diaktifkan!', 'success');
            state.activeTab = 'my-packages';
            render();
        }

        function startExam(packageId) {
            const pkg = state.packages.find(p => p.id === packageId);
            if (!pkg || !state.currentUser) return;

            const existingAttempt = getUserAttemptForPackage(state.currentUser.id, pkg.id);
            if (existingAttempt) {
                showToast('Paket ini sudah pernah dikerjakan dan tidak dapat diulang.', 'warning');
                return;
            }

            const allQuestions = getPackageAllQuestions(pkg);
            if (allQuestions.length === 0) {
                showToast('Paket ini belum memiliki soal.', 'warning');
                return;
            }

            state.examSession = {
                packageId: pkg.id,
                questions: allQuestions,
                currentIndex: 0,
                answers: {},
                doubtful: {},
                remainingSeconds: pkg.duration * 60,
                startedAt: getNowFormatted()
            };
            state.activeTab = 'exam';
            startExamTimer();
            render();
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                if (!state.examSession || state.activeTab !== 'exam') {
                    clearInterval(examTimerInterval);
                    return;
                }
                state.examSession.remainingSeconds -= 1;
                const timerEl = document.getElementById('exam-timer-display');
                if (timerEl) timerEl.textContent = formatSeconds(state.examSession.remainingSeconds);
                if (state.examSession.remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    finishExamAction(true);
                }
            }, 1000);
        }

        function formatSeconds(sec) {
            const safe = Math.max(0, sec);
            const m = Math.floor(safe / 60);
            const s = safe % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function selectExamAnswer(questionId, optionIdx) {
            if (!state.examSession) return;
            state.examSession.answers[questionId] = optionIdx;
            render();
        }

        function toggleExamDoubtful(questionId) {
            if (!state.examSession) return;
            state.examSession.doubtful[questionId] = !state.examSession.doubtful[questionId];
            render();
        }

        function openFinishExamModal() {
            if (!state.examSession) return;
            const total = state.examSession.questions.length;
            const answered = Object.keys(state.examSession.answers).length;

            openModal(`
                <div class="p-6 text-center space-y-4">
                    <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-full mx-auto flex items-center justify-center text-2xl">
                        <i class="fa-solid fa-flag-checkered"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900">Selesaikan Ujian CAT?</h3>
                    <p class="text-xs text-slate-600 leading-relaxed">
                        Anda telah menjawab <strong>${answered} dari ${total} soal</strong>. Setelah dikumpulkan, jawaban tidak dapat diubah kembali.
                    </p>
                    <div class="flex gap-3 pt-2">
                        <button onclick="closeModal()" class="flex-1 py-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-700">Lanjut Mengerjakan</button>
                        <button onclick="closeModal(); finishExamAction(false);" class="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow">Ya, Kumpulkan</button>
                    </div>
                </div>
            `);
        }

        function finishExamAction(isTimeout = false) {
            if (!state.examSession || !state.currentUser) return;
            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }

            const pkg = state.packages.find(p => p.id === state.examSession.packageId);
            const allQuestions = state.examSession.questions || getPackageAllQuestions(pkg);
            let correctCount = 0;
            allQuestions.forEach(q => {
                if (state.examSession.answers[q.id] === q.correctIndex) correctCount++;
            });

            const score = Math.round((correctCount / allQuestions.length) * 100);
            const attemptId = 'ATT-' + Date.now();
            const completedAtTimestamp = Date.now();

            const newAttempt = {
                id: attemptId,
                userId: state.currentUser.id,
                packageId: pkg.id,
                packageTitle: pkg.title,
                answers: { ...state.examSession.answers },
                correctCount,
                totalQuestions: allQuestions.length,
                score,
                passed: score >= pkg.passingGrade,
                date: getNowFormatted(),
                completedAtTimestamp
            };

            state.attempts.unshift(newAttempt);
            state.examSession = null;
            state.selectedAttemptId = attemptId;

            const accessStatus = getReviewAccessStatus(newAttempt);
            state.activeTab = accessStatus.unlocked ? 'review' : 'history';
            saveState();

            if (accessStatus.unlocked) {
                showToast(isTimeout ? 'Waktu habis! Ujian dikumpulkan otomatis.' : 'Ujian selesai!', 'success');
            } else {
                showToast(`Ujian selesai! Pembahasan terkunci sementara (${accessStatus.remainingText}).`, 'info');
            }
            render();
        }

        function handleUpdateOwnProfile(e) {
            e.preventDefault();
            const name = document.getElementById('prof-name').value.trim();
            const newPass = document.getElementById('prof-pass').value;

            const idx = state.users.findIndex(u => u.id === state.currentUser.id);
            if (idx !== -1) {
                state.users[idx].name = name;
                if (newPass) state.users[idx].password = newPass;
                state.currentUser = state.users[idx];
                saveState();
                showToast('Profil diperbarui!', 'success');
                render();
            }
        }

        function savePackageAdmin(e, packageId) {
            e.preventDefault();
            const title = document.getElementById('pkg-title').value.trim();
            const category = document.getElementById('pkg-category').value.trim();
            const price = Number(document.getElementById('pkg-price').value) || 0;
            const duration = Number(document.getElementById('pkg-duration').value) || 30;
            const passingGrade = Number(document.getElementById('pkg-pg').value) || 65;
            const reviewDelayMinutes = Number(document.getElementById('pkg-delay').value) || 0;
            const hideAfterMinutes = Number(document.getElementById('pkg-hide').value) || 0;
            const description = document.getElementById('pkg-desc').value.trim();

            if (!packageId) {
                const newPkgId = 'PKG-' + Math.floor(100 + Math.random() * 900);
                const newPkg = {
                    id: newPkgId,
                    title,
                    category,
                    price,
                    duration,
                    passingGrade,
                    reviewDelayMinutes,
                    hideAfterMinutes,
                    description,
                    subPackages: [
                        { id: 'SUB-' + Date.now(), title: 'Sub-Paket 1: Utama', questions: [] }
                    ]
                };
                state.packages.push(newPkg);
                state.selectedPackageId = newPkgId;
                state.selectedSubPackageId = newPkg.subPackages[0].id;
                showToast('Paket tryout baru berhasil dibuat!', 'success');
            } else {
                const idx = state.packages.findIndex(p => p.id === packageId);
                if (idx !== -1) {
                    state.packages[idx] = {
                        ...state.packages[idx],
                        title,
                        category,
                        price,
                        duration,
                        passingGrade,
                        reviewDelayMinutes,
                        hideAfterMinutes,

        function parseQuestionsFromPlainText(rawText) {
            const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const parsed = [];
            let current = null;
            const pushCurrent = () => {
                if (current && current.text && current.options.length >= 2) {
                    while (current.options.length < 5) current.options.push('-');
                    parsed.push({
                        id: 'Q-' + Date.now() + '-' + Math.floor(Math.random() * 10000),
                        text: current.text,
                        options: current.options.slice(0, 5),
                        correctIndex: current.correctIndex >= 0 && current.correctIndex <= 4 ? current.correctIndex : 0,
                        explanation: current.explanation || 'Pembahasan sesuai kunci.'
                    });
                }
            };
            const letterMap = { A: 0, B: 1, C: 2, D: 3, E: 4 };

            for (const line of lines) {
                const qMatch = line.match(/^(\d+)[\.\)]\s+(.+)/);
                const optMatch = line.match(/^([A-Ea-e])[\.\)]\s+(.+)/);
                const keyMatch = line.match(/^(?:Kunci|Jawaban)\s*[:\-]\s*([A-Ea-e])/i);
                const expMatch = line.match(/^(?:Pembahasan|Penjelasan)\s*[:\-]\s*(.+)/i);

                if (qMatch && !optMatch) {
                    pushCurrent();
                    current = { text: qMatch[2].trim(), options: [], correctIndex: 0, explanation: '' };
                } else if (optMatch && current) {
                    current.options.push(optMatch[2].trim());
                } else if (keyMatch && current) {
                    current.correctIndex = letterMap[keyMatch[1].toUpperCase()] ?? 0;
                } else if (expMatch && current) {
                    current.explanation = expMatch[1].trim();
                } else if (current) {
                    if (current.explanation) current.explanation += ' ' + line;
                    else if (current.options.length === 0) current.text += ' ' + line;
                }
            }
            pushCurrent();
            return parsed;
        }

        function handleWordFileUpload(e, packageId, subPackageId) {
            e.preventDefault();
            const pkg = state.packages.find(p => p.id === packageId);
            const sp = pkg?.subPackages?.find(s => s.id === subPackageId);
            const fileInput = document.getElementById('word-doc-input');
            const file = fileInput?.files?.[0];
            if (!pkg || !sp || !file || typeof mammoth === 'undefined') return;

            const reader = new FileReader();
            reader.onload = function (ev) {
                mammoth.extractRawText({ arrayBuffer: ev.target.result })
                    .then(result => {
                        const imported = parseQuestionsFromPlainText(result.value || '');
                        if (imported.length === 0) {
                            showToast('Tidak ditemukan soal di dokumen Word.', 'warning');
                            return;
                        }
                        sp.questions.push(...imported);
                        saveState();
                        closeModal();
                        showToast(`Berhasil mengimpor ${imported.length} soal!`, 'success');
                        render();
                    })
                    .catch(() => showToast('Gagal membaca file .docx', 'error'));
            };
            reader.readAsArrayBuffer(file);
        }

        function savePaymentMethodAdmin(e, methodId) {
            e.preventDefault();
            const type = document.getElementById('pm-type').value;
            const provider = document.getElementById('pm-provider').value.trim();
            const accountNumber = document.getElementById('pm-number').value.trim();
            const accountName = document.getElementById('pm-name').value.trim();
            const file = document.getElementById('pm-qris-file')?.files?.[0];

            const commitSave = (qrisDataUrl) => {
                if (!state.paymentMethods) state.paymentMethods = [];
                if (!methodId) {
                    state.paymentMethods.push({
                        id: 'PAY-' + Date.now(),
                        type, provider, accountNumber, accountName,
                        qrisImage: qrisDataUrl || (type === 'QRIS' ? 'https://placehold.co/240x240/ffffff/1e293b?text=QRIS' : '')
                    });
                    showToast('Metode pembayaran ditambahkan!', 'success');
                } else {
                    const idx = state.paymentMethods.findIndex(item => item.id === methodId);
                    if (idx !== -1) {
                        state.paymentMethods[idx] = {
                            ...state.paymentMethods[idx],
                            type, provider, accountNumber, accountName,
                            qrisImage: qrisDataUrl || state.paymentMethods[idx].qrisImage
                        };
                        showToast('Metode pembayaran diperbarui!', 'success');
                    }
                }
                saveState();
                closeModal();
                render();
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = ev => commitSave(ev.target.result);
                reader.readAsDataURL(file);
            } else {
                commitSave('');
            }
        }

        function deletePaymentMethodAdmin(methodId) {
            state.paymentMethods = (state.paymentMethods || []).filter(m => m.id !== methodId);
            saveState();
            showToast('Metode pembayaran dihapus.', 'info');
            render();
        }

                                            <th class="py-3 px-4">Rank</th>

                                            <th class="py-3 px-4">Paket</th>
                                            <th class="py-3 px-4">Benar</th>
                                            <th class="py-3 px-4">Skor</th>
                                            <th class="py-3 px-4 text-right">Detail</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y text-xs">
                                        ${filteredAttempts.map((att, idx) => {
                                            const user = state.users.find(u => u.id === att.userId);
                                            return `
                                                <tr class="hover:bg-slate-50">
                                                    <td class="py-3 px-4 font-black">#${idx + 1}</td>
                                                    <td class="py-3 px-4 font-bold text-slate-900">${escapeHtml(user?.name || 'Peserta')}</td>
                                                    <td class="py-3 px-4">${escapeHtml(att.packageTitle)}</td>
                                                    <td class="py-3 px-4 font-bold">${att.correctCount} / ${att.totalQuestions}</td>
                                                    <td class="py-3 px-4 font-black text-indigo-700">${att.score}</td>
                                                    <td class="py-3 px-4 text-right">
                                                        <button onclick="openAdminAttemptQuestionDetailModal('${att.id}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-lg font-bold">Nilai Per Soal</button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function renderAdminRevenue() {
            const approvedTxs = state.transactions.filter(t => t.status === 'approved');
            const totalRevenue = approvedTxs.reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
            const methods = state.paymentMethods || [];

            return `
                <div class="space-y-6 fade-in">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-emerald-600 text-white p-5 rounded-2xl shadow">
                            <span class="text-xs font-bold uppercase text-emerald-100">Total Pendapatan</span>
                            <p class="text-2xl font-black mt-1">${formatRupiah(totalRevenue)}</p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border shadow-sm">
                            <span class="text-xs font-bold uppercase text-slate-500">Menunggu Verifikasi</span>
                            <p class="text-2xl font-black text-amber-600 mt-1">${state.transactions.filter(t => t.status === 'pending').length}</p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border shadow-sm">
                            <span class="text-xs font-bold uppercase text-slate-500">Metode Pembayaran</span>
                            <p class="text-2xl font-black text-indigo-600 mt-1">${methods.length}</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border p-5 sm:p-6 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-900 text-base">Kelola Rekening, QRIS & GoPay</h3>
                            <button onclick="openPaymentMethodModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Tambah</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${methods.map(m => `
                                <div class="p-4 rounded-xl border bg-slate-50 space-y-1">
                                    <div class="flex items-center justify-between">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-600 text-white">${escapeHtml(m.type)}</span>
                                        <div class="space-x-1 text-xs">
                                            <button onclick="openPaymentMethodModal('${m.id}')" class="text-indigo-600 font-bold">Edit</button>
                                            <button onclick="deletePaymentMethodAdmin('${m.id}')" class="text-rose-600 font-bold">Hapus</button>
                                        </div>
                                    </div>
                                    <p class="font-bold text-slate-900 text-sm mt-1">${escapeHtml(m.provider)}</p>
                                    <p class="font-mono text-xs font-bold text-slate-700">${escapeHtml(m.accountNumber)}</p>
                                    <p class="text-[11px] text-slate-500">a.n. ${escapeHtml(m.accountName)}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border p-5 sm:p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-900 text-base border-b pb-3">Verifikasi Bukti Transfer Peserta</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b text-[11px] font-bold uppercase text-slate-500">
                                        <th class="py-3 px-3">ID TRX</th>
                                        <th class="py-3 px-3">Peserta</th>
                                        <th class="py-3 px-3">Paket</th>
                                        <th class="py-3 px-3">Nominal</th>
                                        <th class="py-3 px-3">Status</th>
                                        <th class="py-3 px-3 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${state.transactions.map(tx => {
                                        const buyer = state.users.find(u => u.id === tx.userId);
                                        const pkg = state.packages.find(p => p.id === tx.packageId);
                                        return `
                                            <tr class="hover:bg-slate-50">
                                                <td class="py-3 px-3 font-mono font-bold">${escapeHtml(tx.id)}</td>
                                                <td class="py-3 px-3 font-bold">${escapeHtml(buyer?.name || 'Peserta')}</td>
                                                <td class="py-3 px-3">${escapeHtml(pkg?.title || '-')}</td>
                                                <td class="py-3 px-3 font-bold text-emerald-700">${formatRupiah(tx.amount)}</td>
                                                <td class="py-3 px-3">
                                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${tx.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                        ${tx.status === 'approved' ? 'Lunas' : 'Menunggu'}
                                                    </span>
                                                </td>
                                                <td class="py-3 px-3 text-right">
                                                    <button onclick="viewProofModal('${tx.id}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-lg font-bold">Periksa Bukti</button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminLandingSettings() {
            const contact = { ...defaultState.adminContact, ...(state.adminContact || {}) };
            const faqs = state.faqs || [];

            return `
                <div class="space-y-6 fade-in">
                    <div class="bg-white rounded-2xl border p-5 sm:p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-900 text-base border-b pb-3">Kontak Admin & Pusat Bantuan</h3>
                        <form onsubmit="handleSaveLandingContactAdmin(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">WhatsApp (628xxx)</label>
                                <input type="text" id="lc-wa-num" required value="${escapeHtml(contact.whatsapp)}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Tampilan WhatsApp</label>
                                <input type="text" id="lc-wa-disp" required value="${escapeHtml(contact.whatsappDisplay)}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Email Admin</label>
                                <input type="email" id="lc-email" required value="${escapeHtml(contact.email)}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Jam Operasional</label>
                                <input type="text" id="lc-hours" required value="${escapeHtml(contact.hours)}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Alamat</label>
                                <input type="text" id="lc-address" required value="${escapeHtml(contact.address)}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Judul Bantuan</label>
                                <input type="text" id="lc-help-title" required value="${escapeHtml(contact.helpTitle || 'Butuh Bantuan?')}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Deskripsi Bantuan</label>
                                <input type="text" id="lc-help-desc" required value="${escapeHtml(contact.helpDescription || '')}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm">
                            </div>
                            <div class="md:col-span-2">
                                <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">Simpan Kontak</button>
                            </div>
                        </form>
                    </div>
                    <div class="bg-white rounded-2xl border p-5 sm:p-6 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-900 text-base">Daftar FAQ Halaman Awal</h3>
                            <button onclick="openFaqFormModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Tambah FAQ</button>
                        </div>
                        <div class="space-y-3">
                            ${faqs.map((item, idx) => `
                                <div class="p-4 rounded-xl border bg-slate-50 flex items-start justify-between gap-3">
                                    <div>
                                        <p class="text-xs sm:text-sm font-bold text-slate-900">${idx + 1}. ${escapeHtml(item.question)}</p>
                                        <p class="text-xs text-slate-600 mt-1">${escapeHtml(item.answer)}</p>
                                    </div>
                                    <div class="space-x-2 text-xs shrink-0">
                                        <button onclick="openFaqFormModal('${item.id}')" class="text-indigo-600 font-bold">Edit</button>
                                        <button onclick="deleteFaqAdmin('${item.id}')" class="text-rose-600 font-bold">Hapus</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminUsers() {
            const cfg = state.emailConfig || { serviceId: '', templateId: '', publicKey: '' };

            return `
                <div class="space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-extrabold text-slate-900">Manajemen Akun Pengguna</h2>
                            <p class="text-xs text-slate-500">Tambah akun atau ubah username/password.</p>
                        </div>
                        <button onclick="openEditUserModal()" class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-sm">
                            <i class="fa-solid fa-user-plus mr-1"></i>Tambah Akun
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b text-[11px] font-bold uppercase text-slate-500">
                                        <th class="py-3.5 px-4">Username</th>
                                        <th class="py-3.5 px-4">Nama</th>
                                        <th class="py-3.5 px-4">Email</th>
                                        <th class="py-3.5 px-4">Password</th>
                                        <th class="py-3.5 px-4">Role</th>
                                        <th class="py-3.5 px-4 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y text-xs">
                                    ${state.users.map(user => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="py-3.5 px-4 font-mono font-bold text-indigo-700">${escapeHtml(user.username || '-')}</td>
                                            <td class="py-3.5 px-4 font-bold text-slate-900">${escapeHtml(user.name)}</td>
                                            <td class="py-3.5 px-4 font-mono">${escapeHtml(user.email)}</td>
                                            <td class="py-3.5 px-4 font-mono">${escapeHtml(user.password)}</td>
                                            <td class="py-3.5 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${user.role === 'admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-700'}">${user.role}</span></td>
                                            <td class="py-3.5 px-4 text-right space-x-2">
                                                <button onclick="openEditUserModal('${user.id}')" class="text-indigo-600 font-bold">Edit</button>
                                                ${user.id !== state.currentUser.id ? `<button onclick="deleteUserAdmin('${user.id}')" class="text-rose-600 font-bold">Hapus</button>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-900 text-sm">Konfigurasi EmailJS (Opsional)</h3>
                        <form onsubmit="handleSaveEmailConfig(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div><label class="block text-[11px] font-bold text-slate-600 mb-1">Service ID</label><input type="text" id="cfg-service-id" value="${escapeHtml(cfg.serviceId)}" class="w-full px-3 py-2 border rounded-xl text-xs font-mono"></div>
                            <div><label class="block text-[11px] font-bold text-slate-600 mb-1">Template ID</label><input type="text" id="cfg-template-id" value="${escapeHtml(cfg.templateId)}" class="w-full px-3 py-2 border rounded-xl text-xs font-mono"></div>
                            <div><label class="block text-[11px] font-bold text-slate-600 mb-1">Public Key</label><input type="text" id="cfg-public-key" value="${escapeHtml(cfg.publicKey)}" class="w-full px-3 py-2 border rounded-xl text-xs font-mono"></div>
                            <div class="sm:col-span-3 pt-1"><button type="submit" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">Simpan EmailJS</button></div>
                        </form>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            if (!state.currentUser) app.innerHTML = renderAuthScreen();
            else if (state.currentUser.role === 'admin') app.innerHTML = renderAdminShell();
            else app.innerHTML = renderUserShell();
        }

        window.onload = function () { render(); };
    </script>
</body>
</html>
